name: return_exchange
display_name: "退换货处理"
description: "退货、换货、退款查询与处理"
trigger_intents:
  - return_request
  - exchange_request
  - refund_inquiry

tools:
  - mcp_server: order
    tools: [query_order, check_refund_eligibility, initiate_refund]
  - mcp_server: ticket
    tools: [create_ticket]
  - mcp_server: crm
    tools: [lookup_customer]

knowledge_bases:
  - namespace: return_policy
    weight: 0.5
  - namespace: refund_policy
    weight: 0.3
  - namespace: exchange_policy
    weight: 0.2

prompt_file: system_prompt.md
sop_file: sop.md

escalation:
  trigger_keywords: [投诉, 315, 工商, 法律, 媒体]
  unsatisfied_count: 2
  timeout_minutes: 30
