name: complaint
display_name: "投诉处理"
description: "投诉处理、不满意反馈、纠纷处理"
trigger_intents:
  - complaint

tools:
  - mcp_server: ticket
    tools: [create_ticket, query_ticket, update_ticket]
  - mcp_server: crm
    tools: [lookup_customer, get_customer_history]
  - mcp_server: order
    tools: [query_order]

knowledge_bases:
  - namespace: complaint_policy
    weight: 0.5
  - namespace: compensation_policy
    weight: 0.3
  - namespace: escalation_rules
    weight: 0.2

prompt_file: system_prompt.md
sop_file: sop.md

escalation:
  trigger_keywords: [法律, 律师, 315, 工商, 媒体, 曝光]
  unsatisfied_count: 1
  timeout_minutes: 15
