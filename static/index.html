<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能客服 Demo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    height: 100vh; display: flex; flex-direction: column;
  }

  /* Header */
  .header {
    background: #fff; padding: 12px 20px;
    border-bottom: 1px solid #e8e8e8;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { font-size: 18px; color: #1a1a1a; }
  .header .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #888; }
  .header .dot { width: 8px; height: 8px; border-radius: 50%; background: #52c41a; }
  .header .new-session-btn {
    background: none; border: 1px solid #d9d9d9; border-radius: 6px;
    padding: 4px 12px; font-size: 12px; color: #666; cursor: pointer;
    transition: all .2s;
  }
  .header .new-session-btn:hover { border-color: #1677ff; color: #1677ff; }

  /* Chat area */
  .chat-container {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .chat-container::-webkit-scrollbar { width: 6px; }
  .chat-container::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 3px; }

  /* Messages */
  .msg { display: flex; gap: 10px; max-width: 80%; animation: fadeIn .3s; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.assistant { align-self: flex-start; }
  .msg .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .msg.user .avatar { background: #1677ff; color: #fff; }
  .msg.assistant .avatar { background: #f0f2f5; }

  .bubble {
    padding: 10px 14px; border-radius: 12px; line-height: 1.6;
    word-break: break-word; white-space: pre-wrap;
  }
  .msg.user .bubble { background: #1677ff; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: #fff; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }

  /* Sources */
  .sources { margin-top: 8px; font-size: 12px; color: #888; }
  .source-tag { display: inline-block; background: #f0f2f5; padding: 2px 8px; border-radius: 4px; margin: 2px; }

  /* Handoff buttons */
  .handoff-buttons {
    margin-top: 10px; display: flex; gap: 8px;
  }
  .handoff-btn {
    padding: 6px 16px; border-radius: 6px; font-size: 13px;
    cursor: pointer; border: none; transition: background .2s;
  }
  .handoff-btn.transfer {
    background: #ff4d4f; color: #fff;
  }
  .handoff-btn.transfer:hover { background: #ff7875; }
  .handoff-btn.continue {
    background: #f0f2f5; color: #333; border: 1px solid #d9d9d9;
  }
  .handoff-btn.continue:hover { border-color: #1677ff; color: #1677ff; }
  .handoff-reason {
    margin-bottom: 8px; font-size: 13px; color: #666;
  }

  /* Meta info */
  .meta { font-size: 11px; color: #aaa; margin-top: 4px; }

  /* Input */
  .input-area {
    background: #fff; padding: 12px 20px;
    border-top: 1px solid #e8e8e8;
    display: flex; gap: 10px;
  }
  .input-area textarea {
    flex: 1; border: 1px solid #d9d9d9; border-radius: 8px;
    padding: 10px 12px; resize: none; font-size: 14px;
    font-family: inherit; line-height: 1.5; min-height: 44px; max-height: 120px;
    outline: none; transition: border-color .2s;
  }
  .input-area textarea:focus { border-color: #1677ff; }
  .input-area button {
    background: #1677ff; color: #fff; border: none; border-radius: 8px;
    padding: 0 20px; font-size: 14px; cursor: pointer; white-space: nowrap;
    transition: background .2s;
  }
  .input-area button:hover { background: #4096ff; }
  .input-area button:disabled { background: #a0c4ff; cursor: not-allowed; }

  /* Loading dots */
  .loading-dots { display: flex; gap: 4px; padding: 4px 0; }
  .loading-dots span { width: 6px; height: 6px; background: #bbb; border-radius: 50%; animation: bounce 1.4s infinite; }
  .loading-dots span:nth-child(2) { animation-delay: .2s; }
  .loading-dots span:nth-child(3) { animation-delay: .4s; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes bounce { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }
</style>
</head>
<body>

<div class="header">
  <h1>智能客服 Demo</h1>
  <div style="display:flex;align-items:center;gap:12px;">
    <button class="new-session-btn" onclick="newSession()">+ 新会话</button>
    <div class="status"><span class="dot"></span> API 已连接</div>
  </div>
</div>

<div class="chat-container" id="chatContainer">
  <div class="msg assistant">
    <div class="avatar">🤖</div>
    <div>
      <div class="bubble">您好！我是智能客服助手，有什么可以帮您的？<br><br>您可以尝试询问：<br>• 如何退货？<br>• 我的订单什么时候到？<br>• 怎么修改收货地址？</div>
    </div>
  </div>
</div>

<form class="input-area" id="inputForm">
  <textarea id="userInput" placeholder="输入您的问题..." rows="1" oninput="this.style.height='';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
  <button type="submit" id="sendBtn">发送</button>
</form>

<script>
const API_BASE = '/api/v1';
const chatEl = document.getElementById('chatContainer');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const formEl = document.getElementById('inputForm');

let sessionId = null;
let isLoading = false;

// Auto-generate or reuse session_id from localStorage
function getSessionId() {
  if (sessionId) return sessionId;
  const stored = localStorage.getItem('kefu_session_id');
  if (stored) { sessionId = stored; return sessionId; }
  sessionId = crypto.randomUUID();
  localStorage.setItem('kefu_session_id', sessionId);
  return sessionId;
}

function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addMessage(role, content, sources, meta, handoffInfo) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '👤' : '🤖';

  const body = document.createElement('div');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;

  body.appendChild(bubble);

  if (sources && sources.length > 0) {
    const srcDiv = document.createElement('div');
    srcDiv.className = 'sources';
    srcDiv.innerHTML = '引用来源：' + sources.map(s => `<span class="source-tag">${s}</span>`).join('');
    body.appendChild(srcDiv);
  }

  if (meta) {
    const metaDiv = document.createElement('div');
    metaDiv.className = 'meta';
    metaDiv.textContent = meta;
    body.appendChild(metaDiv);
  }

  // Handoff confirmation buttons
  if (handoffInfo && handoffInfo.pending_handoff) {
    const reasonDiv = document.createElement('div');
    reasonDiv.className = 'handoff-reason';
    reasonDiv.textContent = handoffInfo.pending_handoff_reason || '是否需要转接人工客服？';
    body.appendChild(reasonDiv);

    const btnDiv = document.createElement('div');
    btnDiv.className = 'handoff-buttons';

    const transferBtn = document.createElement('button');
    transferBtn.className = 'handoff-btn transfer';
    transferBtn.textContent = '转人工';
    transferBtn.onclick = () => handleHandoffChoice('转人工');
    btnDiv.appendChild(transferBtn);

    const continueBtn = document.createElement('button');
    continueBtn.className = 'handoff-btn continue';
    continueBtn.textContent = '继续';
    continueBtn.onclick = () => handleHandoffChoice('继续');
    btnDiv.appendChild(continueBtn);

    body.appendChild(btnDiv);
  }

  div.appendChild(avatar);
  div.appendChild(body);
  chatEl.appendChild(div);
  scrollToBottom();
  return div;
}

let pendingHandoffReason = null;

async function handleHandoffChoice(choice) {
  if (!choice || isLoading) return;
  addMessage('user', choice, null, null);
  await sendMessage(choice);
}

function addLoading() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'loadingMsg';
  div.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div>
  `;
  chatEl.appendChild(div);
  scrollToBottom();
  return div;
}

function removeLoading() {
  const el = document.getElementById('loadingMsg');
  if (el) el.remove();
}

function setLoading(loading) {
  isLoading = loading;
  sendBtn.disabled = loading;
  inputEl.disabled = loading;
  if (loading) {
    sendBtn.textContent = '发送中...';
  } else {
    sendBtn.textContent = '发送';
    inputEl.focus();
  }
}

async function sendMessage(message) {
  setLoading(true);
  addLoading();

  try {
    const resp = await fetch(`${API_BASE}/chat`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Tenant-ID': 'default',
      },
      body: JSON.stringify({
        message: message,
        session_id: getSessionId(),
      }),
    });

    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${errText}`);
    }

    const data = await resp.json();

    removeLoading();

    // Update session_id if server returned a new one
    if (data.session_id) {
      sessionId = data.session_id;
      localStorage.setItem('kefu_session_id', sessionId);
    }

    // Build meta info
    const metaParts = [];
    if (data.skill) metaParts.push(`技能: ${data.skill}`);
    if (data.intent) metaParts.push(`意图: ${data.intent}`);

    addMessage('assistant', data.answer, data.sources, metaParts.join(' | '), {
      pending_handoff: data.pending_handoff,
      pending_handoff_reason: data.pending_handoff_reason,
    });

    if (data.needs_handoff) {
      const reason = data.handoff_reason || '系统自动转接';
      addMessage('assistant', `⚠️ 已触发人工客服转接：${reason}`, null, null);
    }
  } catch (err) {
    removeLoading();
    addMessage('assistant', `抱歉，请求失败：${err.message}`, null, null);
    console.error('Chat error:', err);
  } finally {
    setLoading(false);
  }
}

formEl.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text || isLoading) return;

  addMessage('user', text, null, null);
  inputEl.value = '';
  inputEl.style.height = '';
  await sendMessage(text);
});

// Send on Enter (Shift+Enter for newline)
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    formEl.dispatchEvent(new Event('submit'));
  }
});

function newSession() {
  localStorage.removeItem('kefu_session_id');
  sessionId = crypto.randomUUID();  // 立即生成新的，不复用
  localStorage.setItem('kefu_session_id', sessionId);
  chatEl.innerHTML = `
    <div class="msg assistant">
      <div class="avatar">🤖</div>
      <div>
        <div class="bubble">您好！我是智能客服助手，有什么可以帮您的？<br><br>您可以尝试询问：<br>• 如何退货？<br>• 我的订单什么时候到？<br>• 怎么修改收货地址？</div>
      </div>
    </div>
  `;
  inputEl.focus();
}

// Initial focus
inputEl.focus();
</script>
</body>
</html>
